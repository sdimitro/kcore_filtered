# SPDX-License-Identifier: GPL-2.0-only
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  build:
    name: Build (kernel ${{ matrix.kernel }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        kernel: ["6.8", "6.11", "6.12", "6.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Fetch kernel ${{ matrix.kernel }} headers
        run: |
          KDIR=$(bash .github/scripts/fetch-kernel-headers.sh \
                   "${{ matrix.kernel }}" "/tmp/kernel-${{ matrix.kernel }}")
          echo "KDIR=${KDIR}" >> "$GITHUB_ENV"

      - name: Compile module
        run: make KDIR="${KDIR}"

  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-headers-$(uname -r) sparse

      - name: Run checkpatch.pl
        run: make checkpatch

      - name: Run sparse static analysis
        run: make sparse

  test:
    name: Module Tests
    runs-on: ubuntu-24.04
    needs: [build, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-headers-$(uname -r) python3

      - name: Build module
        run: make

      - name: Load module
        run: sudo insmod kcore_filtered.ko

      - name: Run basic tests
        run: sudo bash tests/test_basic.sh

      - name: Run filter validation
        run: sudo python3 tests/test_filter.py

      - name: Unload module
        if: always()
        run: sudo rmmod kcore_filtered 2>/dev/null || true
